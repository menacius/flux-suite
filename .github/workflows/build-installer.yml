name: Build Flux Suite Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/flux-suite-installer/**"
      - "packages/flux-common/**"
      - "cmake/**"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
      - run: cmake -S . -B out/build/installer -G "Visual Studio 17 2022" -A x64 -DFLUX_BUILD_INSTALLER=ON
      - run: cmake --build out/build/installer --config Release
